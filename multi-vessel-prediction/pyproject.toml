[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-vessel-prediction"
version = "0.1.0"
description = "COLREGs-aware multi-vessel trajectory prediction via interaction hypothesis inference and velocity-obstacle rollout"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=3.0",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "pyproj>=3.6",
    "PyYAML>=6.0",
    "h5py>=3.10",
]

[project.optional-dependencies]
seachart = ["pyogrio>=0.7", "shapely>=2.0"]
plots = ["contextily>=1.5"]
# PDDL generation and temporal planning with timed initial literals
# (src/planner_api/pddl.py).
planning = ["unified-planning>=1.3", "up-tamer>=1.1", "up-aries>=0.5"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
