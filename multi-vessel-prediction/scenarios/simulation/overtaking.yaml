# Simulation: two-vessel overtaking encounter. The faster target_1 approaches
# from astern and is OVERTAKING; ego is STAND-ON. target_1 is non-responsive,
# so it never yields — ego alone bears the avoidance burden (Rule 13).
#
# Run:
#   python scripts/run_simulation.py --config scenarios/simulation/overtaking.yaml
#
# See scenarios/README.md for what each block below means, and
# scenarios/viz_reference.yaml for the full list of plotting options (anything
# not set here is left at its default).

scenario:
  dt: 0.5                # timestep [s]
  t_horizon: 100.0        # simulation duration [s]
  noise_std_pos: 0.0      # position observation noise [m], 0 = noiseless
  noise_std_vel: 0.0      # velocity observation noise [m/s]
  seed: 42

  vessels:
    ego:
      speed: 2.0
      heading: 0.0                    # [deg, NED] — 0 = north
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 100.0           # [s] react when TCPA < this
      d_pass: 200.0                   # [m] desired passing distance
      intent: responsive

    target_1:
      encounter: overtaking_astern
      range: 300.0
      lateral_offset_m: 0.0
      speed: 6.0                       # faster than ego, closing from astern
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 100.0
      d_pass: 200.0
      intent: non_responsive           # always holds STAND-ON — demonstrates the
                                        # avoidance-burden override (ego alone must keep clear)

prediction:
  enabled: true
  use_responding_filter: true
  horizon: 100.0
  update_dt: 0.5
  policy_type: vo_analytic
  rollout_model: ct_decoupled_ar
  reclassify_in_rollout: false   # re-run the COLREGs classifier at every rollout step (paper Sec. V-D); false = fixed graph, faster
  top_k_hypotheses: 1      # draw the top-2 most-likely responsiveness-hypothesis
                            # trajectory bundles live (needs use_responding_filter above)

viz:
  trail_length: 0          # 0 = full trail
  realtime_factor: 100.0    # playback speed multiplier
  responding_panel: true    # p(r=R) posterior side panel (needs use_responding_filter above)
