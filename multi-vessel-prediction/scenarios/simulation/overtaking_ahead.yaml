# Simulation: ego overtakes a slower vessel dead ahead on the same course.
# Ego is the OVERTAKING vessel and must keep out of the way (Rule 13), with
# early and substantial action (Rule 16); target_1 is STAND-ON and holds
# course and speed. They close at only 3 m/s, so the CPA lies far beyond a
# short planning horizon.
#
# Run:
#   python scripts/run_simulation.py --config scenarios/simulation/overtaking_ahead.yaml
#
# See scenarios/README.md for what each block below means, and
# scenarios/viz_reference.yaml for the full list of plotting options (anything
# not set here is left at its default).

scenario:
  dt: 0.5                # timestep [s]
  t_horizon: 300.0        # simulation duration [s]: covers the pass (CPA at ~200 s)
  noise_std_pos: 0.0      # position observation noise [m], 0 = noiseless
  noise_std_vel: 0.0      # velocity observation noise [m/s]
  seed: 42

  vessels:
    ego:
      speed: 5.0
      heading: 0.0                    # [deg, NED] — 0 = north
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 100.0           # [s] react when TCPA < this
      d_pass: 200.0                   # [m] desired passing distance
      intent: responsive

    target_1:
      encounter: overtaking_ahead
      range: 600.0
      lateral_offset_m: 0.0           # dead ahead: collision course
      speed: 2.0                      # slower than ego
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 100.0
      d_pass: 200.0
      intent: responsive              # stand-on: keeps course and speed

prediction:
  enabled: true
  use_responding_filter: true
  horizon: 100.0
  update_dt: 0.5
  policy_type: vo_analytic
  rollout_model: ct_decoupled_ar
  reclassify_in_rollout: false   # re-run the COLREGs classifier at every rollout step (paper Sec. V-D); false = fixed graph, faster
  top_k_hypotheses: 1

viz:
  trail_length: 0          # 0 = full trail
  realtime_factor: 100.0    # playback speed multiplier
  responding_panel: true    # p(r=R) posterior side panel (needs use_responding_filter above)
