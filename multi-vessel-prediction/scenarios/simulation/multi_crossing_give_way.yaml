# Simulation: multi_crossing.yaml with a responsive ego. Ego faces three
# simultaneous crossing vessels: two from starboard (ego is GIVE-WAY toward
# both, they hold STAND-ON) and one from port (that vessel is GIVE-WAY toward
# ego, ego holds STAND-ON). All four vessels follow COLREGs. In
# multi_crossing.yaml ego is the non-responsive vessel the others must avoid.
#
# Run:
#   python scripts/run_simulation.py --config scenarios/simulation/multi_crossing_give_way.yaml
#
# See scenarios/README.md for what each block below means, and
# scenarios/viz_reference.yaml for the full list of plotting options (anything
# not set here is left at its default).

scenario:
  dt: 0.5                # timestep [s]
  t_horizon: 100.0        # simulation duration [s]
  noise_std_pos: 0.0      # position observation noise [m], 0 = noiseless
  noise_std_vel: 0.0      # velocity observation noise [m/s]
  seed: 42

  vessels:
    ego:
      speed: 5.0
      heading: 0.0                    # [deg, NED] — 0 = north
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 100.0           # [s] react when TCPA < this
      d_pass: 100.0                   # [m] desired passing distance
      intent: responsive

    target_1:                          # closest starboard crossing -> ego give-way first
      encounter: crossing_starboard
      range: 250.0
      speed: 4.0
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 100.0
      d_pass: 100.0
      intent: responsive

    target_2:                          # farther starboard crossing -> ego give-way, later
      encounter: crossing_starboard
      range: 450.0
      speed: 5.0
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 100.0
      d_pass: 100.0
      intent: responsive

    target_3:                          # port crossing -> target gives way, ego stands on
      encounter: crossing_port
      range: 350.0
      speed: 4.5
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 100.0
      d_pass: 100.0
      intent: responsive

prediction:
  enabled: true
  use_responding_filter: true
  horizon: 100.0
  update_dt: 0.5
  policy_type: vo_analytic
  rollout_model: ct_decoupled_ar
  reclassify_in_rollout: false   # re-run the COLREGs classifier at every rollout step (paper Sec. V-D); false = fixed graph, faster
  top_k_hypotheses: 1      # with N=4 vessels there are 2^4=16 hypotheses; draws
                            # the top-2 most-likely trajectory bundles live

viz:
  padding: 10
  trail_length: 0          # 0 = full trail
  realtime_factor: 100.0    # playback speed multiplier
  responding_panel: true    # p(r=R) posterior side panel (needs use_responding_filter above)
