# milliAmpere variant of ../multi_vessel.yaml. GENERATED by scripts/tools/scale_scenarios.py
# -- edit the original and regenerate rather than editing this file.
#
# Every length and speed is scaled by 0.3; time is unchanged, so the
# encounter unfolds on the same clock. Ego is simulated with the milliAmpere
# 3DOF model (sim_model: milliampere), identified for speeds up to ~2 m/s,
# under dynamic positioning on a reference that steps along the predictor's
# forecast for ego (policy: predictor_dp; vo_analytic gives heading/speed
# control instead). Targets keep their kinematic models.
#
# Run:
#   python scripts/run_simulation.py --config scenarios/simulation/milliampere/multi_vessel.yaml

scenario:
  dt: 0.5
  t_horizon: 75.0
  noise_std_pos: 0.0
  noise_std_vel: 0.0
  seed: 42
  vessels:
    ego:
      speed: 1.5
      heading: 0.0
      sim_model: milliampere
      policy: predictor_dp
      tcpa_threshold: 50.0
      d_pass: 22.5
      intent: responsive
      los_lookahead: 30.0
    target_1:
      encounter: head_on
      range: 120.0
      speed: 1.5
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 50.0
      d_pass: 22.5
      intent: non_responsive
      los_lookahead: 30.0
    target_2:
      encounter: crossing_port
      range: 60.0
      speed: 1.2
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 50.0
      d_pass: 22.5
      intent: responsive
      los_lookahead: 30.0
    target_3:
      encounter: overtaking_ahead
      range: 60.0
      speed: 0.9
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 50.0
      d_pass: 22.5
      intent: responsive
      lateral_offset_m: 15.0
      los_lookahead: 30.0
  classifier:
    d_u: 45.0
    dcpa_max: 450.0
    d_a: 3000.0
prediction:
  enabled: true
  horizon: 120.0
  update_dt: 0.5
  use_responding_filter: true
  policy_type: vo_analytic
  rollout_model: ct_decoupled_ar
  filter_rollout_model: ct_decoupled_ar
  show_nominal_comparison: false
  reclassify_in_rollout: false
  top_k_hypotheses: 1
  dcpa_eval:
    enabled: false
    times_s:
    - 15.0
    - 20.5
    horizon_s: null
    pairs:
    - - target_1
      - ego
    - - target_1
      - target_2
    - - target_1
      - target_3
