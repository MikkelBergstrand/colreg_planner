# Simulation: ego must give way to a vessel crossing close from starboard
# (Rule 15), but its usual escape is blocked: a second vessel runs alongside
# on ego's starboard beam and holds its course, so altering to starboard
# runs into it, and altering to port would cross ahead of the stand-on
# vessel. The crossing is close enough that halving speed still passes too
# near; taking all way off (Rule 8(e)) and letting it cross ahead is the
# clean solution.
#
# Run:
#   python scripts/run_simulation.py --config scenarios/simulation/give_way_stop.yaml
#
# See scenarios/README.md for what each block below means, and
# scenarios/viz_reference.yaml for the full list of plotting options (anything
# not set here is left at its default).

scenario:
  dt: 0.5                # timestep [s]
  t_horizon: 75.0        # simulation duration [s]
  noise_std_pos: 0.0     # position observation noise [m], 0 = noiseless
  noise_std_vel: 0.0     # velocity observation noise [m/s]
  seed: 42

  vessels:
    ego:
      speed: 5.0
      heading: 0.0                    # [deg, NED] — 0 = north
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 50.0            # [s] react when TCPA < this
      d_pass: 75.0                    # [m] desired passing distance
      intent: responsive

    target_1:                         # crossing from starboard: ego gives way
      encounter: crossing_starboard
      range: 100.0
      speed: 4.0
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 50.0
      d_pass: 75.0
      intent: responsive

    target_2:                         # alongside on ego's starboard beam, same course and speed
      encounter: overtaking_ahead
      range: 0.0
      lateral_offset_m: 90.0
      speed: 5.0
      sim_model: ct_decoupled_ar
      policy: vo_analytic
      tcpa_threshold: 50.0
      d_pass: 75.0
      intent: non_responsive          # holds its course whatever happens

prediction:
  enabled: true
  horizon: 100.0
  update_dt: 0.5
  use_responding_filter: true
  policy_type: vo_analytic
  rollout_model: ct_decoupled_ar
  reclassify_in_rollout: false   # re-run the COLREGs classifier at every rollout step (paper Sec. V-D); false = fixed graph, faster
  top_k_hypotheses: 1

viz:
  padding: 100.0
  trail_length: 0          # 0 = full trail
  realtime_factor: 100.0   # playback speed multiplier
  responding_panel: true   # p(r=R) posterior side panel (needs use_responding_filter above)
